name: Deploy na GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: gh-pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Inštalácia závislostí
        run: npm ci

      - name: Build
        run: npm run build

      - name: Aktivácia GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Nahranie buildu
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Nasadenie
        id: deployment
        uses: actions/deploy-pages@v4
